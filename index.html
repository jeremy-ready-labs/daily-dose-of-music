<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Dose of Music</title>
<meta name="description" content="One song a day, new every morning at 7:00 AM.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04030c;
    --ink: #eef0ff;
    --muted: #9aa0c8;
    --faint: #5d6290;
    --glass: rgba(18, 20, 48, 0.55);
    --glass-edge: rgba(160, 170, 255, 0.16);
    --accent: #a78bfa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- space backdrop ---------- */
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .nebula {
    position: fixed; inset: -20%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(40% 35% at 18% 22%, rgba(124, 58, 237, 0.28), transparent 70%),
      radial-gradient(35% 30% at 85% 30%, rgba(14, 165, 233, 0.18), transparent 70%),
      radial-gradient(45% 40% at 70% 90%, rgba(236, 72, 153, 0.16), transparent 70%),
      radial-gradient(30% 25% at 10% 85%, rgba(45, 212, 191, 0.10), transparent 70%);
    filter: blur(20px);
    animation: drift 60s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) rotate(0deg); }
    to   { transform: translate3d(-3%, 2%, 0) rotate(4deg); }
  }

  /* ---------- layout ---------- */
  .wrap {
    position: relative; z-index: 1;
    max-width: 720px; margin: 0 auto;
    padding: 28px 16px 64px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 48px;
  }
  .brand {
    font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: 0.02em; text-decoration: none; color: inherit;
  }
  .clock {
    font-size: 13px; color: var(--muted);
    padding: 7px 12px; border: 1px solid var(--glass-edge); border-radius: 999px;
    background: rgba(10, 12, 32, 0.5); backdrop-filter: blur(8px);
    white-space: nowrap;
  }

  .hero { text-align: center; margin-bottom: 32px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  h1 {
    font-family: "Unbounded", sans-serif; font-weight: 800;
    font-size: clamp(34px, 8vw, 68px); line-height: 1.02; letter-spacing: -0.02em;
    margin: 14px 0 10px;
    background: linear-gradient(100deg, #fff 10%, #c4b5fd 45%, #67e8f9 80%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-wrap: balance;
  }
  .sub { color: var(--muted); font-size: 16px; margin: 0; }

  /* ---------- the player card ---------- */
  .card {
    position: relative;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    border-radius: 28px;
    padding: 28px;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      0 30px 80px -20px rgba(0, 0, 0, 0.7),
      0 0 0 1px rgba(255, 255, 255, 0.02) inset,
      0 0 120px -40px var(--accent);
  }

  .now { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 22px; }

  .play {
    position: relative; width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; color: #0b0920;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 70%);
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent), 0 10px 40px -6px var(--accent);
    transition: transform 0.2s ease, box-shadow 0.3s ease, opacity 0.3s;
  }
  .play:hover { transform: scale(1.05); }
  .play:active { transform: scale(0.97); }
  .play:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .play:disabled { opacity: 0.45; cursor: default; transform: none; }
  .play svg { width: 30px; height: 30px; }
  .play .i-pause { display: none; }
  body.playing .play .i-play { display: none; }
  body.playing .play .i-pause { display: block; }
  body.playing .play { box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 14%, transparent), 0 10px 50px -4px var(--accent); }

  .song { min-width: 0; }
  .song .title {
    font-family: "Unbounded", sans-serif; font-weight: 700;
    font-size: clamp(20px, 4vw, 30px); line-height: 1.15; margin: 0 0 6px;
    overflow-wrap: anywhere;
  }
  .song .artist { color: var(--muted); font-size: 16px; margin: 0; }

  /* little sound bars that bounce while playing */
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 28px; }
  .bars span {
    width: 4px; height: 6px; border-radius: 2px; background: var(--accent); opacity: 0.5;
    transition: height 0.3s, opacity 0.3s;
  }
  body.playing .bars span { opacity: 1; animation: bounce 0.9s ease-in-out infinite alternate; }
  body.playing .bars span:nth-child(2) { animation-delay: -0.3s; animation-duration: 0.7s; }
  body.playing .bars span:nth-child(3) { animation-delay: -0.6s; animation-duration: 1.1s; }
  body.playing .bars span:nth-child(4) { animation-delay: -0.15s; animation-duration: 0.8s; }
  @keyframes bounce { from { height: 6px; } to { height: 28px; } }

  .progress {
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 12px;
    margin-top: 26px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .progress span:last-child { text-align: right; }
  #seek {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; cursor: pointer;
    background: linear-gradient(to right, var(--accent) var(--pct, 0%), rgba(255, 255, 255, 0.12) var(--pct, 0%));
  }
  #seek:disabled { cursor: default; }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px var(--accent); }
  #seek::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 10px var(--accent); }

  .status { margin: 12px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
  .status:empty { display: none; }
  .status a { color: var(--ink); }

  /* popularity meter */
  .meter {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-top: 18px; padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .tier {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 14px;
    color: var(--faint); font-size: 13px;
    border: 1px solid transparent;
    transition: all 0.4s ease;
  }
  .tier i { width: 10px; height: 10px; border-radius: 50%; flex: none; background: currentColor; opacity: 0.6; }
  .tier b { display: block; font-weight: 600; font-size: 14px; }
  .tier small { display: block; font-size: 11.5px; opacity: 0.8; }
  .tier.on {
    color: var(--ink);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .tier.on i { background: var(--accent); opacity: 1; box-shadow: 0 0 12px var(--accent); }
  .tier.on small { color: var(--muted); }

  /* The YouTube player only supplies the sound, so it stays out of sight. */
  .yt-holder {
    position: fixed; left: 0; bottom: 0; width: 200px; height: 200px;
    opacity: 0; pointer-events: none; z-index: -1;
  }

  /* ---------- countdown ---------- */
  .countdown { margin: 40px auto 0; text-align: center; }
  .countdown .label { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .digits {
    display: inline-flex; gap: 10px; margin: 14px 0 10px;
    font-family: "Unbounded", sans-serif; font-weight: 500;
  }
  .digits div {
    min-width: 84px; padding: 14px 10px 10px; border-radius: 18px;
    background: var(--glass); border: 1px solid var(--glass-edge);
    backdrop-filter: blur(12px);
  }
  .digits span { display: block; font-size: 34px; font-variant-numeric: tabular-nums; }
  .digits small { display: block; font-family: "Space Grotesk"; font-size: 11px; color: var(--faint); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }
  .countdown .note { color: var(--faint); font-size: 13px; margin: 0; }

  /* ---------- past songs ---------- */
  .recent { margin-top: 56px; }
  .recent h2 {
    font-family: "Unbounded", sans-serif; font-weight: 500; font-size: 14px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 14px 4px;
  }
  .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .log button {
    width: 100%; display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: 16px; text-align: left;
    background: rgba(14, 16, 40, 0.45); border: 1px solid rgba(160, 170, 255, 0.08);
    color: var(--ink); font: inherit; cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .log button:hover { background: rgba(30, 32, 70, 0.6); border-color: var(--glass-edge); transform: translateX(3px); }
  .log button.active { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .log .when { color: var(--faint); font-size: 13px; }
  .log .what { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .what em { font-style: normal; color: var(--muted); }
  .log .chip { font-size: 11px; padding: 4px 9px; border-radius: 999px; border: 1px solid currentColor; opacity: 0.85; white-space: nowrap; }
  .empty { color: var(--faint); font-size: 14px; padding: 4px; }

  .back {
    display: none; margin: 14px auto 0; font: inherit; font-size: 14px; cursor: pointer;
    padding: 10px 18px; border-radius: 999px; color: var(--ink);
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  }
  body.archive .back { display: block; }

  footer { margin-top: 64px; text-align: center; color: var(--faint); font-size: 12.5px; }
  footer a { color: var(--muted); }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 5;
    transform: translate(-50%, 30px); opacity: 0;
    padding: 12px 20px; border-radius: 999px;
    background: rgba(20, 22, 54, 0.85); border: 1px solid var(--glass-edge);
    backdrop-filter: blur(12px); font-size: 14px;
    transition: all 0.5s cubic-bezier(.2, .8, .2, 1);
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  /* entrance */
  .rise { opacity: 0; transform: translateY(14px); animation: rise 0.9s cubic-bezier(.2, .8, .2, 1) forwards; }
  .rise.d1 { animation-delay: 0.08s; } .rise.d2 { animation-delay: 0.18s; } .rise.d3 { animation-delay: 0.3s; } .rise.d4 { animation-delay: 0.42s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (max-width: 640px) {
    header { margin-bottom: 32px; }
    .brand { font-size: 13px; }
    .card { padding: 20px 18px; border-radius: 22px; }
    .now { grid-template-columns: auto 1fr; gap: 16px; }
    .bars { display: none; }
    .play { width: 68px; height: 68px; }
    .play svg { width: 24px; height: 24px; }
    .meter { gap: 6px; }
    .tier { padding: 8px 10px; }
    .tier small { display: none; }
    .digits { gap: 6px; }
    .digits div { min-width: 0; width: 30vw; max-width: 96px; padding: 12px 6px 8px; }
    .digits span { font-size: 26px; }
    .log button { grid-template-columns: 1fr auto; gap: 4px 10px; }
    .log .when { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .nebula { animation: none; }
    body.playing .bars span { animation: none; height: 16px; }
    .rise { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="nebula" aria-hidden="true"></div>

<div class="wrap">
  <header class="rise">
    <a class="brand" href="./">Daily Dose of Music</a>
    <div class="clock" id="clock">&nbsp;</div>
  </header>

  <section class="hero">
    <div class="eyebrow rise d1"><span class="dot"></span><span id="doseLabel">Today's song</span></div>
    <h1 class="rise d1">Daily Dose<br>of Music</h1>
    <p class="sub rise d2" id="dateLine">&nbsp;</p>
  </section>

  <main class="card rise d3">
    <div class="now">
      <button class="play" id="playBtn" type="button" aria-label="Play" disabled>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2" fill="currentColor"/></svg>
      </button>
      <div class="song">
        <p class="title" id="songTitle">Tuning in…</p>
        <p class="artist" id="songArtist">&nbsp;</p>
      </div>
      <div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    </div>

    <div class="progress">
      <span id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Song position" disabled>
      <span id="dur">0:00</span>
    </div>
    <p class="status" id="status" aria-live="polite"></p>

    <div class="meter">
      <div class="tier" data-tier="rising"><i></i><div><b>Rising Star</b><small>Kind of popular</small></div></div>
      <div class="tier" data-tier="chart"><i></i><div><b>Chart-Topper</b><small>Everyone knows it</small></div></div>
    </div>
  </main>

  <button class="back" id="backBtn" type="button">← Back to today's song</button>

  <section class="countdown rise d4">
    <div class="label">Next song in</div>
    <div class="digits">
      <div><span id="hh">--</span><small>hours</small></div>
      <div><span id="mm">--</span><small>min</small></div>
      <div><span id="ss">--</span><small>sec</small></div>
    </div>
    <p class="note" id="dropNote">&nbsp;</p>
  </section>

  <section class="recent rise d4">
    <h2>Past songs</h2>
    <ul class="log" id="log"></ul>
  </section>

  <footer>A new song every morning at 7:00 AM · Music via <a id="ytLink" href="#" target="_blank" rel="noopener">YouTube</a></footer>
</div>

<div class="yt-holder" aria-hidden="true"><div id="player"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* =====================================================================
   PICKING THE SONG OF THE DAY
   It's random but deterministic: every visitor on the same day hears the
   same song, and no song repeats until its whole list has been played.
   ===================================================================== */

const DAY_MS = 86400000;
const ymdFmt = new Intl.DateTimeFormat("en-US", {
  timeZone: SITE_TIMEZONE, hourCycle: "h23",
  year: "numeric", month: "numeric", day: "numeric",
  hour: "numeric", minute: "numeric", second: "numeric",
});

// The current wall-clock time at the site's timezone.
function siteClock(now = new Date()) {
  const p = Object.fromEntries(ymdFmt.formatToParts(now).map(x => [x.type, +x.value || 0]));
  return { y: p.year, mo: p.month, d: p.day, h: p.hour, mi: p.minute, s: p.second };
}

// Day number since 1970 for the "music day" (which starts at 7 AM, not midnight).
function musicDayNumber(now = new Date()) {
  const c = siteClock(now);
  const day = Math.floor(Date.UTC(c.y, c.mo - 1, c.d) / DAY_MS);
  return c.h < DROP_HOUR ? day - 1 : day;
}

const [ly, lm, ld] = LAUNCH_DATE.split("-").map(Number);
const LAUNCH_DAY = Date.UTC(ly, lm - 1, ld) / DAY_MS;

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(n, seed) {
  const rand = mulberry32(seed);
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const tierSalt = { rising: 202, chart: 303 };
const mod = (a, n) => ((a % n) + n) % n;

// skip = how many songs to step past (used if a song won't play).
function songForDay(dayNum, skip = 0) {
  const k = dayNum - LAUNCH_DAY;
  const tier = ROTATION[mod(k, ROTATION.length)];
  const list = SONGS[tier];
  const slot = Math.floor(k / ROTATION.length) + skip;
  const pass = Math.floor(slot / list.length);
  const order = shuffled(list.length, tierSalt[tier] * 7919 + pass * 104729);
  const song = list[order[mod(slot, list.length)]];
  return { ...song, tier, number: k + 1, dayNum };
}

/* =====================================================================
   UI
   ===================================================================== */

const $ = id => document.getElementById(id);
const tzShort = new Intl.DateTimeFormat("en-US", { timeZone: SITE_TIMEZONE, timeZoneName: "short" })
  .formatToParts(new Date()).find(p => p.type === "timeZoneName").value;

function dateFromDayNum(dayNum) { return new Date(dayNum * DAY_MS + 12 * 3600000); }
const longDate = new Intl.DateTimeFormat("en-US", { timeZone: "UTC", weekday: "long", month: "long", day: "numeric", year: "numeric" });
const shortDate = new Intl.DateTimeFormat("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" });

let player = null, playerReady = false;
let todayNum = musicDayNumber();
let current = null;        // song currently loaded
let viewingDay = todayNum; // which day's song is on screen
let skip = 0;              // fallback steps for the day being viewed
let wantPlay = false;      // whether the listener has pressed play

function render(song, autoplay = false) {
  current = song;
  $("songTitle").textContent = song.title;
  $("songArtist").textContent = song.artist;
  $("ytLink").href = "https://www.youtube.com/watch?v=" + song.id;
  $("status").textContent = "";
  document.querySelectorAll(".tier").forEach(el => el.classList.toggle("on", el.dataset.tier === song.tier));
  document.documentElement.style.setProperty("--accent", TIERS[song.tier].color);

  const isToday = song.dayNum === todayNum;
  document.body.classList.toggle("archive", !isToday);
  $("doseLabel").textContent = (isToday ? "Today's song" : "Replaying song") + " · #" + song.number;
  $("dateLine").textContent = longDate.format(dateFromDayNum(song.dayNum)) + " · " + TIERS[song.tier].name;
  document.title = isToday ? `${song.title} · Daily Dose of Music` : "Daily Dose of Music";

  setProgress(0, 0);
  if (playerReady) {
    wantPlay = autoplay;
    autoplay ? player.loadVideoById(song.id) : player.cueVideoById(song.id);
    if (!autoplay) setPlaying(false);
  }
  renderLog();
}

function show(dayNum, autoplay = false) {
  viewingDay = dayNum;
  skip = 0;
  render(songForDay(dayNum), autoplay);
}

function renderLog() {
  const log = $("log");
  log.innerHTML = "";
  const first = Math.max(LAUNCH_DAY, todayNum - 6);
  if (todayNum - 1 < first) {
    log.innerHTML = '<li class="empty">This is the very first song. Past songs will show up here.</li>';
    return;
  }
  for (let d = todayNum - 1; d >= first; d--) {
    const s = songForDay(d);
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    if (d === viewingDay) b.classList.add("active");
    b.innerHTML = `<span class="when"></span><span class="what"></span><span class="chip"></span>`;
    b.querySelector(".when").textContent = shortDate.format(dateFromDayNum(d));
    const what = b.querySelector(".what");
    what.textContent = s.title + " ";
    const em = document.createElement("em");
    em.textContent = "· " + s.artist;
    what.appendChild(em);
    const chip = b.querySelector(".chip");
    chip.textContent = TIERS[s.tier].name;
    chip.style.color = TIERS[s.tier].color;
    b.addEventListener("click", () => { show(d, true); window.scrollTo({ top: 0, behavior: "smooth" }); });
    li.appendChild(b);
    log.appendChild(li);
  }
}

$("backBtn").addEventListener("click", () => show(todayNum));

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 4500);
}

/* ---------- play / pause + progress ---------- */
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

function setPlaying(on) {
  document.body.classList.toggle("playing", on);
  $("playBtn").setAttribute("aria-label", on ? "Pause" : "Play");
}

function setProgress(cur, dur) {
  const seek = $("seek");
  if (!seeking) {
    seek.max = dur || 100;
    seek.value = cur;
    seek.style.setProperty("--pct", dur ? (cur / dur) * 100 + "%" : "0%");
  }
  $("cur").textContent = fmt(cur);
  $("dur").textContent = fmt(dur);
  seek.disabled = !dur;
}

$("playBtn").addEventListener("click", () => {
  if (!playerReady) return;
  if (document.body.classList.contains("playing")) {
    wantPlay = false;
    player.pauseVideo();
  } else {
    wantPlay = true;
    player.playVideo();
  }
});

let seeking = false;
$("seek").addEventListener("input", e => {
  seeking = true;
  const v = +e.target.value, max = +e.target.max;
  e.target.style.setProperty("--pct", (v / max) * 100 + "%");
  $("cur").textContent = fmt(v);
});
$("seek").addEventListener("change", e => {
  seeking = false;
  if (playerReady) player.seekTo(+e.target.value, true);
});

document.addEventListener("keydown", e => {
  if (e.code === "Space" && !/INPUT|BUTTON|TEXTAREA/.test(document.activeElement.tagName)) {
    e.preventDefault();
    $("playBtn").click();
  }
});

setInterval(() => {
  if (playerReady && player.getDuration) setProgress(player.getCurrentTime(), player.getDuration());
}, 250);

/* ---------- clock + countdown + the 7 AM flip ---------- */
const pad = n => String(n).padStart(2, "0");
const localTime = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
const siteTime = new Intl.DateTimeFormat("en-US", { timeZone: SITE_TIMEZONE, hour: "numeric", minute: "2-digit", second: "2-digit" });
const sameTz = Intl.DateTimeFormat().resolvedOptions().timeZone === SITE_TIMEZONE;

function tick() {
  const now = new Date();
  const c = siteClock(now);
  let secs = DROP_HOUR * 3600 - (c.h * 3600 + c.mi * 60 + c.s);
  if (secs <= 0) secs += 86400;

  $("hh").textContent = pad(Math.floor(secs / 3600));
  $("mm").textContent = pad(Math.floor(secs / 60) % 60);
  $("ss").textContent = pad(secs % 60);
  $("clock").textContent = siteTime.format(now) + " " + tzShort;

  let note = `New song every day at 7:00 AM ${tzShort}`;
  if (!sameTz) note += ` (${localTime.format(new Date(now.getTime() + secs * 1000))} your time)`;
  $("dropNote").textContent = note;

  // The moment it turns 7:00 AM, swap in the new song.
  const n = musicDayNumber(now);
  if (n !== todayNum) {
    const wasOnToday = viewingDay === todayNum;
    todayNum = n;
    if (wasOnToday) { show(n); toast("Today's new song is here"); }
    else renderLog();
  }
}

/* ---------- YouTube (audio only — the video is never shown) ---------- */
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player("player", {
    width: 200, height: 200,
    videoId: current.id,
    playerVars: { rel: 0, playsinline: 1, controls: 0, disablekb: 1 },
    events: {
      onReady: () => { playerReady = true; $("playBtn").disabled = false; },
      onStateChange: e => {
        const S = YT.PlayerState;
        if (e.data === S.PLAYING) setPlaying(true);
        else if (e.data === S.PAUSED || e.data === S.CUED) setPlaying(false);
        else if (e.data === S.ENDED) { setPlaying(false); wantPlay = false; player.seekTo(0, true); player.pauseVideo(); }
      },
      onError: () => {
        // Song removed or blocked from playing on other sites: use the next one in the same list.
        if (++skip >= SONGS[current.tier].length) return;
        render(songForDay(viewingDay, skip), wantPlay);
      },
    },
  });
};

/* ---------- boot ---------- */
show(todayNum);
tick();
setInterval(tick, 1000);

const yt = document.createElement("script");
yt.src = "https://www.youtube.com/iframe_api";
yt.onerror = () => {
  $("status").innerHTML = `The player couldn't load here. <a href="https://www.youtube.com/watch?v=${current.id}" target="_blank" rel="noopener">Listen on YouTube →</a>`;
};
document.head.appendChild(yt);

/* =====================================================================
   STARFIELD
   ===================================================================== */
(function stars() {
  const cv = $("stars"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, dpr, field = [], shooters = [], mx = 0, my = 0, tx = 0, ty = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * dpr;
    H = cv.height = innerHeight * dpr;
    const count = Math.round((innerWidth * innerHeight) / 2600);
    field = Array.from({ length: count }, () => {
      const z = Math.random();
      return {
        x: Math.random() * W, y: Math.random() * H, z,
        r: (0.3 + z * 1.3) * dpr,
        tw: Math.random() * Math.PI * 2,
        sp: 0.5 + Math.random() * 2,
        hue: Math.random() < 0.15 ? (Math.random() < 0.5 ? 200 : 270) : 0,
      };
    });
  }
  addEventListener("resize", resize);
  addEventListener("pointermove", e => { tx = (e.clientX / innerWidth - 0.5); ty = (e.clientY / innerHeight - 0.5); });
  resize();

  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    mx += (tx - mx) * 0.04; my += (ty - my) * 0.04;
    const time = t / 1000;
    for (const s of field) {
      if (!reduce) { s.y += s.z * 0.06 * dpr; if (s.y > H) s.y = 0; }
      const px = s.x - mx * 30 * s.z * dpr, py = s.y - my * 30 * s.z * dpr;
      const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * s.sp + s.tw)) * (0.4 + s.z * 0.6);
      ctx.fillStyle = s.hue ? `hsla(${s.hue}, 90%, 80%, ${a})` : `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(px, py, s.r, 0, Math.PI * 2); ctx.fill();
      if (s.z > 0.92) {
        ctx.fillStyle = `rgba(200,210,255,${a * 0.12})`;
        ctx.beginPath(); ctx.arc(px, py, s.r * 4, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (!reduce && Math.random() < 0.004 && shooters.length < 2) {
      shooters.push({ x: Math.random() * W * 0.8, y: Math.random() * H * 0.4, vx: (6 + Math.random() * 6) * dpr, vy: (2 + Math.random() * 3) * dpr, life: 1 });
    }
    shooters = shooters.filter(s => s.life > 0);
    for (const s of shooters) {
      const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 14, s.y - s.vy * 14);
      g.addColorStop(0, `rgba(255,255,255,${s.life})`);
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = g; ctx.lineWidth = 1.5 * dpr;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 14, s.y - s.vy * 14); ctx.stroke();
      s.x += s.vx; s.y += s.vy; s.life -= 0.015;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
